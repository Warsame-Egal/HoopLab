spring.application.name=hooplab
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hooplab}
spring.datasource.username=${POSTGRES_USER:hooplab}
spring.datasource.password=${POSTGRES_PASSWORD:changeme}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

ingestion.base-url=${INGESTION_BASE_URL:http://localhost:8000}

# Optional: set in production to require X-Admin-Key on /api/admin/* (leave empty for local dev)
hooplab.admin.api-key=${HOOPLAB_ADMIN_API_KEY:}

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=5m

springdoc.swagger-ui.path=/swagger-ui.html

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

hooplab.ingest.seasons-back=${HOOPLAB_INGEST_SEASONS_BACK:8}
hooplab.ingest.measures=${HOOPLAB_INGEST_MEASURES:Base,Advanced}
