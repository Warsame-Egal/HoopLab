services:
  data:
    build: ./data
    container_name: hooplab-data
    env_file:
      - .env
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    container_name: hooplab-backend
    env_file:
      - .env
    environment:
      DATA_BASE_URL: http://data:8000
    ports:
      - "8080:8080"
    depends_on:
      data:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
        VITE_WS_URL: ""
    container_name: hooplab-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
